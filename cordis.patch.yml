# dsh-introspect 的 bundle 补丁（照 dsh-mindmap / dsh-grafana 格式）：
# 把 host 半边插入 loader 树。可选配置写在 config 里（见 README「配置」）。
- insert:
    - id: introspect
      name: dsh-introspect
      config:
        # 留空 = 默认 $DSH_HOME/introspect/events.sqlite3
        dbPath: ''
        # MEL × RRI 曲线的默认时间窗（小时，1-168）
        chartHours: 24
